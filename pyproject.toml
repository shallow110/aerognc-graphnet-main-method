[project]
name = "psdg-net-open-source"
version = "0.1.0"
description = "PSDG-Net executable physical-semantic graph method and two reproducible experiments"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "torch",
]

[project.scripts]
psdg-train = "experiments.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["psdg_net*", "experiments*"]
